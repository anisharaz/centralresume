version: "3.8"

networks:
  default:
    external: true
    name: cr-app
  postgres:
    external: true
    name: cr-postgres
  mongodb:
    external: true
    name: cr-mongo

services:
  main_app:
    image: "ghcr.io/anisharaz/centralresume:main_app_1_0"
    container_name: cr-main-app
    ports:
      - "127.0.0.1:3010:3000"
    restart: always
    networks:
      default:
        gw_priority: 1
      postgres:
      mongodb:
    volumes:
      - ./data/main_app/.env:/app/.env:ro
