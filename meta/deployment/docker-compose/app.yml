version: "3.8"

networks:
  default:
    name: cr-app
    external: false
  postgres:
    external: true
    name: cr-postgres
  mongodb:
    external: true
    name: cr-mongo

services:
  main_app:
    image: "ghcr.io/anisharaz/centralresume:main_app_1_0"
    ports:
      - "127.0.0.1:3007:3000"
    restart: always
    networks:
      default:
        gw_priority: 1
      postgres:
      mongodb:
    volumes:
      - ./data/main_app/.env:/app/.env:ro
    depends_on:
      - backend

  backend:
    image: "ghcr.io/anisharaz/centralresume:be_1_0"
    ports:
      - "127.0.0.1:3008:4000"
    restart: always
    networks:
      default:
        gw_priority: 1
      postgres:
      mongodb:
    volumes:
      - ./data/be/.env:/app/.env:ro
