networks:
  default:
    external: true
    name: cr-main-network
  postgres:
    external: true
    name: cr-postgres-net
  mongodb:
    external: true
    name: cr-mongo-net

services:
  api-backend:
    image: "ghcr.io/anisharaz/centralresume:be_1_0"
    container_name: cr-api-backend
    ports:
      - "127.0.0.1:3011:4000"
    restart: always
    networks:
      default:
        gw_priority: 1
      postgres:
      mongodb:
    volumes:
      - ../data/be/.env:/app/.env:ro
