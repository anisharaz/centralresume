name: Publish Docker image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Choose which application to build"
        required: true
        type: choice
        options:
          - main_app
          - be
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Main App Docker image
        if: inputs.publish == 'main_app'
        uses: docker/build-push-action@v6
        with:
          context: ./main_app
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anisharaz/centralresume:main_app_1_0
      - name: Replace Native Protocol Prisma Schema with Main App Schema
        if: inputs.publish == 'be'
        run: |
          rm -rf ./native_protocol_backend/prisma && cp -r ./main_app/prisma ./native_protocol_backend/ && rm -rf ./native_protocol_backend/src/meta && cp -r ./meta ./native_protocol_backend/src/
      - name: Build and push Native Protocol Backend Docker image
        if: inputs.publish == 'be'
        uses: docker/build-push-action@v6
        with:
          context: ./native_protocol_backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anisharaz/centralresume:be_1_0
