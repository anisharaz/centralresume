name: Publish Docker image
on: workflow_dispatch
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Main App Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./main_app
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anisharaz/centralresume:main_app_1_0
      - name: Replace Native Protocol Prisma Schema with Main App Schema
        run: |
          rm ./native_protocol_backend/prisma/schema.prisma && cp ./main_app/prisma/schema.prisma ./native_protocol_backend/prisma/schema.prisma
      - name: Build and push Native Protocol Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./native_protocol_backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anisharaz/centralresume:be_1_0
